name: Build and push fork dev image

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

# If a new push lands while a build is still running, cancel the older one.
# A multi-arch build takes ~25-30 min and we don't want a queue of stale builds.
concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wheel + multi-arch docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve upstream base image version
        run: |
          echo "BASE_IMAGE_VERSION=$(python scripts/resolve_base_image_version.py .github/workflows/release.yml)" >> "$GITHUB_ENV"

      - name: Lowercase repository owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Derive build version
        id: version
        run: |
          BASE_VERSION=$(grep -E '^version *= *' pyproject.toml | head -1 | sed -E 's/.*= *"([^"]+)".*/\1/')
          # Strip any existing .devN / +local from upstream pyproject.toml
          BASE_VERSION=$(echo "$BASE_VERSION" | sed -E 's/(\.dev[0-9]+)?(\+[a-zA-Z0-9.]+)?$//')
          TIMESTAMP=$(date -u +%Y%m%d%H%M)
          VERSION="${BASE_VERSION}.dev${TIMESTAMP}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION (sha $SHORT_SHA)"

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"
          check-latest: true

      - name: Install build deps
        run: pip install build tomli tomli-w

      - name: Write build version into pyproject.toml
        shell: python
        run: |
          import tomli, tomli_w
          with open("pyproject.toml", "rb") as f:
              data = tomli.load(f)
          data["project"]["version"] = "${{ steps.version.outputs.version }}"
          with open("pyproject.toml", "wb") as f:
              tomli_w.dump(data, f)

      # Bundle the shared MA app credentials into the wheel so provider
      # integrations (Qobuz, Spotify, ...) work out of the box in the image.
      # The blob is stored as the APP_SECRETS_JSON repo secret; when it is not
      # set (e.g. a downstream fork), the step is skipped and the build still
      # succeeds with unprovisioned (empty) app vars.
      - name: Provision app secrets
        env:
          APP_SECRETS_JSON: ${{ secrets.APP_SECRETS_JSON }}
        run: |
          if [ -n "$APP_SECRETS_JSON" ]; then
            printf '%s' "$APP_SECRETS_JSON" > music_assistant/helpers/app_secrets.json
            echo "Provisioned app_secrets.json ($(wc -c < music_assistant/helpers/app_secrets.json) bytes)"
          else
            echo "APP_SECRETS_JSON not set; skipping (app vars will resolve empty)"
          fi

      - name: Build wheel
        run: python -m build

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build and push image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/music-assistant:dev
            ghcr.io/${{ steps.owner.outputs.name }}/music-assistant:dev-${{ steps.version.outputs.short_sha }}
          build-args: |
            MASS_VERSION=${{ steps.version.outputs.version }}
            BASE_IMAGE_VERSION=${{ env.BASE_IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
